[project]
name = "pechka-subtitle"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "boto3==1.35.0",
    "psycopg2-binary==2.9.10",
    "faster-whisper==1.0.3",
    "requests==2.32.3",
]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
addopts = "-v"

[tool.coverage.run]
source = ["."]
omit = ["test_*.py"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mutmut]
paths_to_mutate = "generate.py"
tests_dir = "."
runner = "python -m pytest -x -q"
