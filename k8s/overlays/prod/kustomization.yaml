apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pechka

resources:
  - ../../base
  - secrets/secrets.yaml
  - ingress.yaml


patches:
  - path: pvc-local-path-patch.yaml


generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: pechka-config
    behavior: merge
    literals:
      - allowed-ip-range=10.0.0.0/8
      - s3-endpoint=minio.external-service.svc.cluster.local:9000
      - postgres-host=postgres.external-service.svc.cluster.local
  - name: minio-setup-config
    behavior: merge
    literals:
      - s3-endpoint=minio.external-service.svc.cluster.local:9000
  - name: postgres-migrate-config
    behavior: merge
    literals:
      - POSTGRES_HOSTS=postgres.external-service.svc.cluster.local
