apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pechka

resources:
  - ../../base
  - secrets/secrets.yaml
  - external-postgres.yaml
  - ingress.yaml


patches:
  - path: pvc-local-path-patch.yaml


generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: pechka-config
    behavior: merge
    literals:
      - allowed-ip-range=10.0.0.0/8
      - s3-endpoint-1=10.20.1.61:9000
      - s3-endpoint-2=10.20.1.62:9000
      - s3-endpoint-3=10.20.1.63:9000
      - s3-fallback-endpoint-1=10.20.1.61:9000
      - s3-fallback-endpoint-2=10.20.1.62:9000
      - s3-fallback-endpoint-3=10.20.1.63:9000
      - postgres-host-1=10.20.1.41
      - postgres-host-2=10.20.1.42
      - postgres-host-3=10.20.1.43
  - name: minio-setup-config
    behavior: merge
    literals:
      - s3-endpoint=10.20.1.61:9000
