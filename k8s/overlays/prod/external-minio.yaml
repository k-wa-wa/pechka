# アプリケーション本体用の minio Service は、nuage-cluster リポジトリの external-service namespace
# が管理する Service (ExternalName) で名前解決する（IP をこの Service 定義で直接持たない）。
# postgres-migrate / minio-setup (PreSyncフック) が待機先としてこのServiceを参照するため、通常Syncフェーズ
# （PreSyncの後）任せだと、namespaceが作り直された場合にServiceが未作成のままフックが終わらず
# デッドロックする。secrets/secrets.yaml の postgres-secret と同じ理由でPreSyncフック化し、
# Jobより小さいsync-waveを与える。
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: pechka
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
spec:
  type: ExternalName
  externalName: minio.external-service.svc.cluster.local
  ports:
    - name: api
      port: 9000
---
# k8s/base/infra/nginx/nginx.yaml の @minio_prod_fallback がprod/preview共通で参照する別名。
# prodでは minio と全く同じ実体なので、フォールバックが呼ばれても同じ404が返るだけで実害はない
# (previewだけがローカルminio(未ヒット)からこのServiceへ実際にフォールバックする)。
apiVersion: v1
kind: Service
metadata:
  name: minio-prod
  namespace: pechka
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
spec:
  type: ExternalName
  externalName: minio.external-service.svc.cluster.local
  ports:
    - name: api
      port: 9000
---
# s3.wpcapp.net Ingress (Cilium Ingress) 専用のバックエンド Service。
# Cilium Ingress は ExternalName を EDS で解決できず 503 になるため、セレクタなし Service と EndpointSlice を定義する。
# この Service は Ingress 専用であり PreSync フック (minio-setup 等) からは参照されないため、
# PreSync フックは付与せず通常の同期リソースとして永続化する。
# これにより、同期ごとに削除・再作成されて ClusterIP が再割り当てされる問題を完全に防止する。
#
# 注意:
# minio-ingress-slice の endpoints (10.20.1.61-63) は nuage-cluster の
# nix/hosts/swfs-cluster/nodes.nix および terraform/vpc/zone-private-persistent-fs/swfs-cluster.tf
# に定義された swfs 実機 IP である。nuage-cluster 側で IP 変更やノード増減があった場合は、
# 本マニフェスト側も手動追従が必要となる。
# また、静的 EndpointSlice は Kubernetes の Pod/ノードヘルスチェックによる自動除外が行われないため、
# ノード障害・再起動時の縮退は Envoy (Cilium Ingress) の outlier detection に依存する。
apiVersion: v1
kind: Service
metadata:
  name: minio-ingress
  namespace: pechka
spec:
  ports:
    - name: api
      protocol: TCP
      port: 9000
      targetPort: 9000
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: minio-ingress-slice
  namespace: pechka
  labels:
    kubernetes.io/service-name: minio-ingress
    endpointslice.kubernetes.io/managed-by: pechka-k8s
addressType: IPv4
ports:
  - name: api
    port: 9000
    protocol: TCP
endpoints:
  - addresses:
      - 10.20.1.61
    conditions:
      ready: true
  - addresses:
      - 10.20.1.62
    conditions:
      ready: true
  - addresses:
      - 10.20.1.63
    conditions:
      ready: true
