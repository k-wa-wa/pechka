apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pechka-ingress-public
  namespace: pechka
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-cloudflare-prod"
spec:
  ingressClassName: cilium
  tls:
    - hosts:
        - pechka.wpcapp.net
        - pechka-workflow.wpcapp.net
      secretName: pechka-tls-secret
  rules:
    - host: pechka.wpcapp.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  number: 80
    - host: pechka-workflow.wpcapp.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argo-server
                port:
                  number: 2746
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pechka-ingress-s3-internal
  namespace: pechka
  annotations:
    nginx.ingress.kubernetes.io/whitelist-source-range: "10.0.0.0/8,192.168.5.0/24"
spec:
  ingressClassName: cilium
  tls:
    - hosts:
        - s3.wpcapp.net
      secretName: wpcapp-net-wildcard-tls
  rules:
    - host: s3.wpcapp.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minio
                port:
                  number: 9000
