apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
  namespace: pechka
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: <path:secrets/prod-secrets.yaml#MONGO_INITDB_ROOT_USERNAME>
  MONGO_INITDB_ROOT_PASSWORD: <path:secrets/prod-secrets.yaml#MONGO_INITDB_ROOT_PASSWORD>
  MONGO_INITDB_DATABASE: <path:secrets/prod-secrets.yaml#MONGO_INITDB_DATABASE>
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: pechka
  # postgres-migrate (PreSyncフック) がこのSecretを参照するため、通常Syncフェーズ
  # （PreSyncの後）任せだと、namespaceが作り直された場合にSecret未作成のままフックが
  # 失敗し続ける。k8s/overlays/preview/local-secrets.yaml と同じ理由でPreSyncフック化し、
  # Jobより小さいsync-waveを与える。
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  POSTGRES_USER: <path:secrets/prod-secrets.yaml#DB_USER>
  POSTGRES_PASSWORD: <path:secrets/prod-secrets.yaml#DB_PASSWORD>
  POSTGRES_DB: <path:secrets/prod-secrets.yaml#DB_NAME>
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-secret
  namespace: pechka
type: Opaque
stringData:
  MINIO_ROOT_USER: <path:secrets/prod-secrets.yaml#MINIO_ROOT_USER>
  MINIO_ROOT_PASSWORD: <path:secrets/prod-secrets.yaml#MINIO_ROOT_PASSWORD>
---
apiVersion: v1
kind: Secret
metadata:
  name: openai-secret
  namespace: pechka
type: Opaque
stringData:
  OPENAI_API_KEY: <path:secrets/prod-secrets.yaml#OPENAI_API_KEY>
  OPENAI_BASE_URL: <path:secrets/prod-secrets.yaml#OPENAI_BASE_URL>
