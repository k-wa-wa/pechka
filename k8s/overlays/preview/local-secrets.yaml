apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  # postgres-migrate / postgres-seed-from-prod (PreSyncフック) がこのSecretを参照するため、
  # 通常Syncフェーズ（PreSyncの後）任せだと新規namespaceでは常にSecret未作成のまま
  # フックが失敗し続ける。ConfigMap postgres-migrations と同じ手法で、このSecretも
  # PreSyncフック化しJobより小さいsync-waveを与えることで、フック実行前に確実に
  # 作成されるようにする。
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  POSTGRES_USER: pechka
  POSTGRES_PASSWORD: changeme
  POSTGRES_DB: pechka
---
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: pechka
  MONGO_INITDB_ROOT_PASSWORD: changeme
  MONGO_INITDB_DATABASE: pechka
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-secret
type: Opaque
stringData:
  MINIO_ROOT_USER: pechka
  MINIO_ROOT_PASSWORD: changeme_minio
