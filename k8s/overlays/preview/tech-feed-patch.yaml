# preview 環境では CronWorkflow を動かさず、preview-apps AppProject の許可リスト (WorkflowTemplate のみ) に
# 収めるため削除する。手動実行は workflowTemplateRef: { name: tech-feed } の Workflow を kubectl create する。
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: tech-feed-daily-ai
  namespace: pechka
$patch: delete
---
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: tech-feed-weekly-k8s
  namespace: pechka
$patch: delete
---
# pr-<N> タグは同一 PR への追加 push で上書きされるため、明示的に Always を指定する。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aivisspeech
  namespace: pechka
spec:
  template:
    spec:
      containers:
        - name: aivisspeech
          imagePullPolicy: Always
