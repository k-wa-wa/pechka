# PRのpreview環境。
# - api/frontend/vrt-report/storybook-report: このPRのイメージ (frontend/vrt-report/storybook-reportはCIが別々のイメージとしてbuild/push)
# - nginx: prodと同一のイメージ (アプリ本体の配信のみ担当。/vrt-report・/storybookはingressでそれぞれ直接ルーティングし、nginxを経由しない)
# - postgres/mongodb/elasticsearch/benthos: local overlay同様、preview専用の自前コンテナ
#   (postgresのみ起動時にprodの実データを一度コピーしてくる)
# - minio: PRごとの使い捨てローカルコンテナ (minio-local.yaml)。書き込みはここだけに閉じる。
#   読み取り (GET/HEAD) だけ、ローカルに無い既存コンテンツを本番 swfs
#   (pechka-config の s3-fallback-endpoint) へ透過フォールバックする
#   (k8s/base/infra/nginx/nginx.conf の @minio_prod_fallback)。本番への書き込みは nginx 側で禁止している。
#
# - postgres-seed-from-prod Job が読む postgres-seed-secret と tech-feed が読む openai-secret は、
#   この overlay ではなく同じ namespace にデプロイされる k8s/overlays/preview-secret (別 Application) が用意する。
#   secret の実体化だけ argocd-vault-plugin (plugin) を使うため、Application 自体を分けている
#   (この overlay はネイティブ kustomize のみで、CMP/plugin 類は一切使わない)。
# - tech-feed: CronWorkflow (tech-feed-daily-ai / tech-feed-weekly-k8s) は preview-apps AppProject の
#   許可リスト外のため tech-feed-patch.yaml ($patch: delete) で除外し、aivisspeech Deployment は
#   既定 replicas: 0 としてある。手動で確かめる手順:
#   1. argocd app set pechka-pr-<N> --self-heal=false (selfHeal による replicas: 0 戻しを止める)
#   2. kubectl -n <namespace> scale deployment aivisspeech --replicas=1
#   3. kubectl -n <namespace> rollout status deployment/aivisspeech
#   4. kubectl create で workflowTemplateRef: { name: tech-feed } の Workflow を作る
#      (注: 現状の preview-network-policy では kube-apiserver 10.96.0.1:443 が遮断されているため、
#       preview 内で Workflow を実実行するにはネットワーク方針または構成の見直しが別途必要)
#   5. 確認後: kubectl -n <namespace> scale deployment aivisspeech --replicas=0 && argocd app set pechka-pr-<N> --self-heal=true
#
# namespace 名・イメージタグ・ingress host は ArgoCD 側のネイティブな kustomize.namespace/images/patches
# 上書きで PR ごとに書き換える (docs/ideas/nash/nash-preview.yaml と同じやり方)。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - ../../base/infra/configmap
  - ../../base/api
  - ../../base/frontend
  - ../../base/infra/nginx
  - ../../base/infra/mongodb
  - ../../base/infra/elasticsearch
  - ../../base/infra/benthos
  - ../../base/infra/postgres
  - ../../base/etl
  - ../../base/tech-feed
  - postgres
  - local-secrets.yaml
  - minio-local.yaml
  - postgres-prod-shim.yaml
  - seed-from-prod-job.yaml
  - vrt-report.yaml
  - storybook-report.yaml
  - ingress.yaml

patches:
  - path: pvc-local-path-patch.yaml
  - path: pdb-delete-patch.yaml
  - path: replicas-patch.yaml
  - path: tech-feed-patch.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: pechka-config
    behavior: merge
    literals:
      - allowed-ip-range=0.0.0.0/0
      - s3-fallback-endpoint=minio.external-service.svc.cluster.local:9000
      # preview 環境の NetworkPolicy は他 Namespace (bare-web-proxy) への通信を遮断するため、空にして直接取得する。
      - bare-web-proxy-url=
