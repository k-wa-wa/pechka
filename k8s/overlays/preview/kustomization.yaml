# PRのpreview環境。
# - api/frontend/vrt-report/storybook-report: このPRのイメージ (frontend/vrt-report/storybook-reportはCIが別々のイメージとしてbuild/push)
# - nginx: prodと同一のイメージ (アプリ本体の配信のみ担当。/vrt-report・/storybookはingressでそれぞれ直接ルーティングし、nginxを経由しない)
# - postgres/mongodb/elasticsearch/benthos: local overlay同様、preview専用の自前コンテナ
#   (postgresのみ起動時にprodの実データを一度コピーしてくる)
# - minio: PRごとの使い捨てローカルコンテナ (minio-local.yaml)。書き込みはここだけに閉じる。
#   読み取り (GET/HEAD) だけ、ローカルに無い既存コンテンツを本番 swfs 実ノード 3 台
#   (pechka-config の s3-fallback-endpoint-1〜3) へ透過フォールバックする
#   (k8s/base/infra/nginx/nginx.conf の @minio_prod_fallback)。本番への書き込みは nginx 側で禁止している。
#
# postgres-seed-from-prod Job が読む postgres-seed-secret は、このoverlayではなく
# 同じnamespaceにデプロイされる k8s/overlays/preview-secret (別Application) が用意する。
# secretの実体化だけargocd-vault-plugin (plugin) を使うため、Application自体を分けている
# (このoverlayはネイティブkustomizeのみで、CMP/plugin類は一切使わない)。
#
# namespace名・イメージタグ・ingress hostはArgoCD側のネイティブなkustomize.namespace/images/patches
# 上書きでPRごとに書き換える (docs/ideas/nash/nash-preview.yaml と同じやり方)。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - ../../base/infra/configmap
  - ../../base/api
  - ../../base/frontend
  - ../../base/infra/nginx
  - ../../base/infra/mongodb
  - ../../base/infra/elasticsearch
  - ../../base/infra/benthos
  - ../../base/infra/postgres
  - ../../base/etl
  - postgres
  - local-secrets.yaml
  - minio-local.yaml
  - postgres-prod-shim.yaml
  - seed-from-prod-job.yaml
  - vrt-report.yaml
  - storybook-report.yaml
  - ingress.yaml

patches:
  - path: pvc-local-path-patch.yaml
  - path: pdb-delete-patch.yaml
  - path: replicas-patch.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: pechka-config
    behavior: merge
    literals:
      - allowed-ip-range=0.0.0.0/0
      - s3-fallback-endpoint-1=10.20.1.61:9000
      - s3-fallback-endpoint-2=10.20.1.62:9000
      - s3-fallback-endpoint-3=10.20.1.63:9000
