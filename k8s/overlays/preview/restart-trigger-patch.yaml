# api/frontendは"pr-<N>"という固定タグをprevious pushでも使い回すため(reusable workflow
# k-wa-wa/nuage-workspace/.github/workflows/docker-build-push.ymlのタグ付け仕様)、
# registry側のイメージ中身(digest)が変わってもDeploymentのimageフィールドの文字列自体は
# 変化しない。kustomize/ArgoCDはPodテンプレートの差分が無いと再作成をトリガーしないため、
# コードだけ直しても既存Podが古いバイナリのまま動き続けてしまう
# (413修正時のnginx-configと同じ問題のapi版。api-sa起動時のnamespace固定バグ修正の
# 反映確認中に実際に踏んだ: レジストリ側は新digestになっていたが、Podは古いままだった)。
#
# 恒久対応(CIがコミットSHAをannotationに書き戻す等)は別途要検討。当面はこのannotationの
# 値を手動で更新し、pushのたびに明示的にPodの再作成を強制する。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: pechka
spec:
  template:
    metadata:
      annotations:
        pechka.dev/restartedAt: "2026-09-27T09:35:00Z"
