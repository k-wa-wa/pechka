# VRT (Playwright) レポートだけを配信する軽量な静的配信コンテナ。preview専用。
# イメージタグ (pr-<N>) の自動差し替えはこのoverlay単体では行われない
# (nuage-cluster側のArgoCD ApplicationSetの対応が別途必要)。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vrt-report
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vrt-report
  template:
    metadata:
      labels:
        app: vrt-report
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vrt-report
          image: ghcr.io/k-wa-wa/pechka-vrt-report:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /vrt-report/
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: vrt-report
spec:
  selector:
    app: vrt-report
  ports:
    - port: 80
      targetPort: 8080
