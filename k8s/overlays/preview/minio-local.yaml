# previewの書き込み先(アップロード・HLS生成物)はPRごとに使い捨てのローカルS3互換コンテナにする。
# postgresと違い起動時にprodのデータをコピーしてこない(=最初は空)。読み取りは
# k8s/base/infra/nginx/nginx.yaml の @minio_prod_fallback が、ローカルに無い既存コンテンツ
# (404)だけをprod実体(minio-prod, minio-shim.yaml)へ中継する。
#
# 実装には adobe/s3mock を使う(本物のMinIOではない)。理由:
# - MinIO本体のDockerイメージはライセンス方針変更により Docker Hub / quay.io とも
#   匿名pullできなくなっている(2026-09時点で確認: どちらもanonymous pullが401)。
# - s3mockは認証・認可を一切検証しない(テスト専用ツール)ため、api/etlは既存の
#   minio-secret (pechka/changeme_minio, ダミー値でよい) をそのまま使い回せる。
# - COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS で起動時にバケットが自動作成されるため、
#   MinIOのような別途バケット作成/匿名ポリシー設定Jobが不要になる(s3mockは全リクエストを
#   無条件に許可するため、匿名DL許可の設定自体が要らない)。
# - デフォルトポートは 9090(HTTP)/9191(HTTPS)。Service側で 9000 にマップし、
#   configmap(minio-url: minio:9000)やnginx.confの `minio.pechka.svc.cluster.local:9000`
#   参照は変更不要にしている。
#
# データはemptyDir(preview環境の破棄と同時に消える想定。PRごとに複製が要る規模ではない)。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: adobe/s3mock:latest
          env:
            - name: COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS
              value: pechka
          ports:
            - name: api
              containerPort: 9090
          readinessProbe:
            tcpSocket:
              port: 9090
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9090
