apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - benthos.yaml

# benthos-streams はハッシュサフィックス付きで生成する(disableNameSuffixHashを付けない)。
# 内容が変わるたびにConfigMap名が変わり、Deploymentのvolume参照も自動的に追従するため、
# Argo CDの同期だけでPodがローリング再起動される。BenthosはstreamsモードでConfigMapの
# ホットリロードをしないため、これがないと設定変更がPod再起動なしに反映されない。
configMapGenerator:
  - name: benthos-streams
    namespace: pechka
    files:
      - streams/contents.yaml
      - streams/subtitles.yaml
