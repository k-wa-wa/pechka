# 字幕は published のトラックのみ配信用の subtitles コレクションに同期する。
# draft（未レビュー）のトラックは同期対象から外れる（＝視聴者には見えない）ことで、
# 公開ゲートを兼ねる。draft に戻された場合は delete-one で既存ドキュメントを削除する。
#
# 既知の制約: このJOINは subtitle_tracks が存在する行しか拾えないため、
# コンテンツ自体が削除されて subtitle_tracks が ON DELETE CASCADE で消えた場合、
# 対応する delete-one が一度も発行されず MongoDB 側にドキュメントが残り続ける
# （既存の contents.yaml ストリームも同種の限界を抱えている、ポーリング型CDC共通の制約）。
# 真に解決するには論理レプリケーション等の real CDC への切り替えが必要で、v1のスコープ外とする。
input:
  generate:
    mapping: 'root = {}'
    interval: 2s

pipeline:
  processors:
    - sql_raw:
        driver: postgres
        dsn: "${POSTGRES_DSN}"
        query: |
          SELECT
              c.short_id,
              t.language,
              t.status,
              COALESCE(
                  (SELECT json_agg(json_build_object(
                      'start_ms', cu.start_ms,
                      'end_ms', cu.end_ms,
                      'text', cu.text
                   ) ORDER BY cu.seq, cu.start_ms, cu.id)
                   FROM subtitle_cues cu
                   WHERE cu.track_id = t.id
                  ), '[]'::json
              ) AS cues
          FROM subtitle_tracks t
          JOIN contents c ON c.id = t.content_id
          -- published は常に対象、draft はステータス変更直後の短い猶予期間のみ対象にする。
          -- こうしないと draft トラックに対して2秒おきに delete-one が永続的に送られ続けてしまう
          -- (delete-one 自体は冪等だが、無駄なDB書き込みが積み重なる)。
          WHERE t.status = 'published' OR t.updated_at > NOW() - INTERVAL '10 seconds';
    - mapping: |
        root = if this.type() == "object" {
          if this.short_id != null {
            [{
              "_id": this.short_id + ":" + this.language,
              "short_id": this.short_id,
              "language": this.language,
              "status": this.status,
              "cues": this.cues.parse_json().catch(this.cues)
            }]
          } else { deleted() }
        } else if this.type() == "array" {
          if this.length() == 0 {
            deleted()
          } else {
            this.map_each(item -> {
              "_id": item.short_id + ":" + item.language,
              "short_id": item.short_id,
              "language": item.language,
              "status": item.status,
              "cues": item.cues.parse_json().catch(item.cues)
            })
          }
        } else {
          deleted()
        }
    - unarchive:
        format: json_array

output:
  fallback:
    - retry:
        max_retries: 5
        backoff:
          initial_interval: 1s
          max_interval: 30s
          max_elapsed_time: 5m
        output:
          switch:
            cases:
              - check: 'this.status == "published"'
                output:
                  mongodb:
                      url: "${MONGO_URL}"
                      database: pechka
                      collection: subtitles
                      operation: update-one
                      upsert: true
                      filter_map: 'root = {"_id": this._id}'
                      document_map: 'root = {"$set": this}'
                      write_concern:
                        w: "1"
              - check: 'true'
                output:
                  mongodb:
                      url: "${MONGO_URL}"
                      database: pechka
                      collection: subtitles
                      operation: delete-one
                      filter_map: 'root = {"_id": this._id}'
                      write_concern:
                        w: "1"
    - stdout: {}
