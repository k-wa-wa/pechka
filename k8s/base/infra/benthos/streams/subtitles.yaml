# 字幕は published のトラックのみ配信用の subtitles コレクションに同期する。
# draft（未レビュー）のトラックや、親コンテンツが論理削除済み（c.deleted_at IS NOT NULL）のトラックは
# delete-one で既存ドキュメントを削除することで非配信にする。
#
# 既知の制約: 親コンテンツの削除は contents.deleted_at による論理削除へ移行したため、
# c.deleted_at IS NOT NULL を条件に含めることでステータス（draft含む）や経過時間によらず delete-one を発行できる。
# 一方、subtitle_tracks 行自体が物理削除された場合のみポーリング型CDC共通の制約が残る。
input:
  generate:
    mapping: 'root = {}'
    interval: 2s

pipeline:
  processors:
    - sql_raw:
        driver: pgx
        dsn: "${POSTGRES_DSN}"
        query: |
          SELECT
              c.short_id,
              t.language,
              t.status,
              c.deleted_at,
              CASE
                  WHEN t.status = 'published' AND c.deleted_at IS NULL THEN
                      COALESCE(
                          (SELECT json_agg(json_build_object(
                              'start_ms', cu.start_ms,
                              'end_ms', cu.end_ms,
                              'text', cu.text
                           ) ORDER BY cu.seq, cu.start_ms, cu.id)
                           FROM subtitle_cues cu
                           WHERE cu.track_id = t.id
                          ), '[]'::json
                      )
                  ELSE '[]'::json
              END AS cues
          FROM subtitle_tracks t
          JOIN contents c ON c.id = t.content_id
          -- published および親が論理削除済み（c.deleted_at IS NOT NULL）のトラックは常に対象、
          -- 未削除親の draft はステータス変更直後の短い猶予期間のみ対象にする。
          -- こうしないと未削除親の draft トラックに対して2秒おきに delete-one が永続的に送られ続けてしまう
          -- (delete-one 自体は冪等だが、無駄なDB書き込みが積み重なる)。
          WHERE t.status = 'published' OR c.deleted_at IS NOT NULL OR t.updated_at > NOW() - INTERVAL '10 seconds';
    - mapping: |
        root = if this.type() == "object" {
          if this.short_id != null {
            [{
              "_id": this.short_id + ":" + this.language,
              "short_id": this.short_id,
              "language": this.language,
              "status": this.status,
              "deleted_at": this.deleted_at,
              "cues": this.cues.parse_json().catch(this.cues)
            }]
          } else { deleted() }
        } else if this.type() == "array" {
          if this.length() == 0 {
            deleted()
          } else {
            this.map_each(item -> {
              "_id": item.short_id + ":" + item.language,
              "short_id": item.short_id,
              "language": item.language,
              "status": item.status,
              "deleted_at": item.deleted_at,
              "cues": item.cues.parse_json().catch(item.cues)
            })
          }
        } else {
          deleted()
        }
    - unarchive:
        format: json_array

output:
  fallback:
    - retry:
        max_retries: 5
        backoff:
          initial_interval: 1s
          max_interval: 30s
          max_elapsed_time: 5m
        output:
          switch:
            cases:
              - check: 'this.status == "published" && this.deleted_at == null'
                output:
                  mongodb:
                    url: "${MONGO_URL}"
                    database: pechka
                    collection: subtitles
                    operation: update-one
                    upsert: true
                    filter_map: 'root = {"_id": this._id}'
                    document_map: 'root = {"$set": this}'
                    write_concern:
                      w: "1"
              - check: 'true'
                output:
                  mongodb:
                    url: "${MONGO_URL}"
                    database: pechka
                    collection: subtitles
                    operation: delete-one
                    filter_map: 'root = {"_id": this._id}'
                    write_concern:
                      w: "1"
    - stdout: {}
