input:
  generate:
    mapping: 'root = {}'
    interval: 2s

pipeline:
  processors:
    - sql_raw:
        driver: pgx
        dsn: "${POSTGRES_DSN}"
        query: |
          SELECT
              c.id::text AS id,
              c.short_id,
              c.content_type,
              c.channel_id,
              COALESCE(ch.name, c.channel_id) AS channel_name,
              c.disc_id::text AS disc_id,
              c.title,
              c.description,
              c.duration_seconds,
              c.is_360,
              array_to_json(c.tags) AS tags,
              c.status,
              c.thumbnail_key,
              c.document_key,
              c.document_mime_type,
              c.published_at,
              c.archived_at,
              c.created_at,
              c.updated_at,
              c.deleted_at,
              d.label AS disc_label,
              COALESCE(
                  (SELECT json_agg(json_build_object(
                      'variant_type', v.variant_type,
                      'hls_key', v.hls_key,
                      'bandwidth', v.bandwidth,
                      'resolution', v.resolution
                   ))
                   FROM video_variants v
                   WHERE v.content_id = c.id
                  ), '[]'::json
              ) AS variants,
              EXISTS(
                  SELECT 1 FROM subtitle_tracks st
                  WHERE st.content_id = c.id AND st.status = 'published'
              ) AS has_subtitles
          FROM contents c
          LEFT JOIN channels ch ON c.channel_id = ch.id
          LEFT JOIN discs d ON c.disc_id = d.id;
    - mapping: |
        root = if this.type() == "object" {
          if this.short_id != null {
            [{
              "id": this.id,
              "short_id": this.short_id,
              "content_type": this.content_type,
              "channel_id": this.channel_id,
              "channel_name": this.channel_name,
              "disc_id": this.disc_id,
              "title": this.title,
              "description": this.description,
              "duration_seconds": this.duration_seconds,
              "is_360": this.is_360,
              "tags": this.tags.parse_json().catch(this.tags),
              "status": this.status,
              "thumbnail_key": this.thumbnail_key,
              "document_key": this.document_key,
              "document_mime_type": this.document_mime_type,
              "published_at": this.published_at,
              "archived_at": this.archived_at,
              "created_at": this.created_at,
              "updated_at": this.updated_at,
              "deleted_at": this.deleted_at,
              "disc_label": this.disc_label,
              "variants": this.variants.parse_json().catch(this.variants),
              "has_subtitles": this.has_subtitles
            }]
          } else { deleted() }
        } else if this.type() == "array" {
          if this.length() == 0 {
            deleted()
          } else {
            this.map_each(item -> {
              "id": item.id,
              "short_id": item.short_id,
              "content_type": item.content_type,
              "channel_id": item.channel_id,
              "channel_name": item.channel_name,
              "disc_id": item.disc_id,
              "title": item.title,
              "description": item.description,
              "duration_seconds": item.duration_seconds,
              "is_360": item.is_360,
              "tags": item.tags.parse_json().catch(item.tags),
              "status": item.status,
              "thumbnail_key": item.thumbnail_key,
              "document_key": item.document_key,
              "document_mime_type": item.document_mime_type,
              "published_at": item.published_at,
              "archived_at": item.archived_at,
              "created_at": item.created_at,
              "updated_at": item.updated_at,
              "deleted_at": item.deleted_at,
              "disc_label": item.disc_label,
              "variants": item.variants.parse_json().catch(item.variants),
              "has_subtitles": item.has_subtitles
            })
          }
        } else {
          deleted()
        }
    - unarchive:
        format: json_array

output:
  fallback:
    - retry:
        max_retries: 5
        backoff:
          initial_interval: 1s
          max_interval: 30s
          max_elapsed_time: 5m
        output:
          broker:
            pattern: fan_out
            outputs:
              - mongodb:
                  url: "${MONGO_URL}"
                  database: pechka
                  collection: contents
                  operation: update-one
                  upsert: true
                  filter_map: 'root = {"_id": this.short_id}'
                  document_map: |
                    root = this
                    root.published_at = if this.published_at != null { {"$date": {"$numberLong": this.published_at.ts_unix_milli().string()}} } else { null }
                    root.archived_at = if this.archived_at != null { {"$date": {"$numberLong": this.archived_at.ts_unix_milli().string()}} } else { null }
                    root.created_at = if this.created_at != null { {"$date": {"$numberLong": this.created_at.ts_unix_milli().string()}} } else { null }
                    root.updated_at = if this.updated_at != null { {"$date": {"$numberLong": this.updated_at.ts_unix_milli().string()}} } else { null }
                    root.deleted_at = if this.deleted_at != null { {"$date": {"$numberLong": this.deleted_at.ts_unix_milli().string()}} } else { null }
                    root = {"$set": root}
                  write_concern:
                    w: "1"
              - elasticsearch_v8:
                  urls:
                    - "${ELASTICSEARCH_URL}"
                  index: pechka_contents
                  id: '${! json("short_id") }'
                  action: index
    - stdout: {}
