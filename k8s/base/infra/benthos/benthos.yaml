apiVersion: apps/v1
kind: Deployment
metadata:
  name: benthos
  namespace: pechka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: benthos
  template:
    metadata:
      labels:
        app: benthos
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4195"
        prometheus.io/path: "/metrics"
    spec:
      initContainers:
        - name: wait-for-mongodb
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z mongodb 27017; do echo "waiting for mongodb..."; sleep 2; done']
      containers:
        - name: benthos
          image: ghcr.io/redpanda-data/connect:latest
          args:
            - streams
            - /streams/contents.yaml
            - /streams/subtitles.yaml
          env:
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: pechka-config
                  key: postgres-host
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: pechka-config
                  key: postgres-port
            - name: SSL_MODE
              valueFrom:
                configMapKeyRef:
                  name: pechka-config
                  key: ssl-mode
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
            - name: POSTGRES_DSN
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)?sslmode=$(SSL_MODE)"
            - name: MONGO_HOST
              valueFrom:
                configMapKeyRef:
                  name: pechka-config
                  key: mongo-host
            - name: MONGO_PORT
              valueFrom:
                configMapKeyRef:
                  name: pechka-config
                  key: mongo-port
            - name: MONGO_USER
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGO_INITDB_ROOT_USERNAME
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGO_INITDB_ROOT_PASSWORD
            - name: MONGO_DB
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGO_INITDB_DATABASE
            - name: MONGO_URL
              value: "mongodb://$(MONGO_USER):$(MONGO_PASSWORD)@$(MONGO_HOST):$(MONGO_PORT)/$(MONGO_DB)?authSource=admin&w=1"
            - name: ELASTICSEARCH_URL
              valueFrom:
                configMapKeyRef:
                  name: pechka-config
                  key: elasticsearch-url
          ports:
            - containerPort: 4195
              name: http
          volumeMounts:
            - name: streams
              mountPath: /streams
          livenessProbe:
            httpGet:
              path: /ping
              port: 4195
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 4195
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: streams
          configMap:
            name: benthos-streams
---
apiVersion: v1
kind: Service
metadata:
  name: benthos
  namespace: pechka
spec:
  selector:
    app: benthos
  ports:
    - port: 4195
      targetPort: 4195
      name: http
