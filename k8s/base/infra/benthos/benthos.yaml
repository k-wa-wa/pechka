apiVersion: v1
kind: ConfigMap
metadata:
  name: benthos-streams
  namespace: pechka
data:
  contents.yaml: |
    input:
      generate:
        mapping: 'root = {}'
        interval: 2s

    pipeline:
      processors:
        - sql_raw:
            driver: postgres
            dsn: "${POSTGRES_DSN}"
            query: |
              SELECT
                  c.short_id,
                  c.content_type,
                  c.title,
                  c.description,
                  c.duration_seconds,
                  c.is_360,
                  array_to_json(c.tags) AS tags,
                  c.status,
                  c.thumbnail_key,
                  c.published_at,
                  c.updated_at,
                  d.label AS disc_label,
                  COALESCE(
                      (SELECT json_agg(json_build_object(
                          'variant_type', v.variant_type,
                          'hls_key', v.hls_key,
                          'bandwidth', v.bandwidth,
                          'resolution', v.resolution
                       ))
                       FROM video_variants v
                       WHERE v.content_id = c.id
                      ), '[]'::json
                  ) AS variants,
                  EXISTS(
                      SELECT 1 FROM subtitle_tracks st
                      WHERE st.content_id = c.id AND st.status = 'published'
                  ) AS has_subtitles
              FROM contents c
              LEFT JOIN discs d ON c.disc_id = d.id;
        - mapping: |
            root = if this.type() == "object" {
              if this.short_id != null {
                [{
                  "short_id": this.short_id,
                  "content_type": this.content_type,
                  "title": this.title,
                  "description": this.description,
                  "duration_seconds": this.duration_seconds,
                  "is_360": this.is_360,
                  "tags": this.tags.parse_json().catch(this.tags),
                  "status": this.status,
                  "thumbnail_key": this.thumbnail_key,
                  "published_at": this.published_at,
                  "updated_at": this.updated_at,
                  "disc_label": this.disc_label,
                  "variants": this.variants.parse_json().catch(this.variants),
                  "has_subtitles": this.has_subtitles
                }]
              } else { deleted() }
            } else if this.type() == "array" {
              if this.length() == 0 {
                deleted()
              } else {
                this.map_each(item -> {
                  "short_id": item.short_id,
                  "content_type": item.content_type,
                  "title": item.title,
                  "description": item.description,
                  "duration_seconds": item.duration_seconds,
                  "is_360": item.is_360,
                  "tags": item.tags.parse_json().catch(item.tags),
                  "status": item.status,
                  "thumbnail_key": item.thumbnail_key,
                  "published_at": item.published_at,
                  "updated_at": item.updated_at,
                  "disc_label": item.disc_label,
                  "variants": item.variants.parse_json().catch(item.variants),
                  "has_subtitles": item.has_subtitles
                })
              }
            } else {
              deleted()
            }
        - unarchive:
            format: json_array

    output:
      fallback:
        - retry:
            max_retries: 5
            backoff:
              initial_interval: 1s
              max_interval: 30s
              max_elapsed_time: 5m
            output:
              broker:
                pattern: fan_out
                outputs:
                  - mongodb:
                      url: "${MONGO_URL}"
                      database: pechka
                      collection: contents
                      operation: update-one
                      upsert: true
                      filter_map: 'root = {"_id": this.short_id}'
                      document_map: 'root = {"$set": this}'
                      write_concern:
                        w: "1"
                  - elasticsearch:
                      urls:
                        - "${ELASTICSEARCH_URL}"
                      index: pechka_contents
                      id: '${! json("short_id") }'
                      action: index
        - stdout: {}
  subtitles.yaml: |
    # 字幕は published のトラックのみ配信用の subtitles コレクションに同期する。
    # draft（未レビュー）のトラックは同期対象から外れる（＝視聴者には見えない）ことで、
    # 公開ゲートを兼ねる。draft に戻された場合は delete-one で既存ドキュメントを削除する。
    #
    # 既知の制約: このJOINは subtitle_tracks が存在する行しか拾えないため、
    # コンテンツ自体が削除されて subtitle_tracks が ON DELETE CASCADE で消えた場合、
    # 対応する delete-one が一度も発行されず MongoDB 側にドキュメントが残り続ける
    # （既存の contents.yaml ストリームも同種の限界を抱えている、ポーリング型CDC共通の制約）。
    # 真に解決するには論理レプリケーション等の real CDC への切り替えが必要で、v1のスコープ外とする。
    input:
      generate:
        mapping: 'root = {}'
        interval: 2s

    pipeline:
      processors:
        - sql_raw:
            driver: postgres
            dsn: "${POSTGRES_DSN}"
            query: |
              SELECT
                  c.short_id,
                  t.language,
                  t.status,
                  COALESCE(
                      (SELECT json_agg(json_build_object(
                          'start_ms', cu.start_ms,
                          'end_ms', cu.end_ms,
                          'text', cu.text
                       ) ORDER BY cu.seq, cu.start_ms, cu.id)
                       FROM subtitle_cues cu
                       WHERE cu.track_id = t.id
                      ), '[]'::json
                  ) AS cues
              FROM subtitle_tracks t
              JOIN contents c ON c.id = t.content_id
              -- published は常に対象、draft はステータス変更直後の短い猶予期間のみ対象にする。
              -- こうしないと draft トラックに対して2秒おきに delete-one が永続的に送られ続けてしまう
              -- (delete-one 自体は冪等だが、無駄なDB書き込みが積み重なる)。
              WHERE t.status = 'published' OR t.updated_at > NOW() - INTERVAL '10 seconds';
        - mapping: |
            root = if this.type() == "object" {
              if this.short_id != null {
                [{
                  "_id": this.short_id + ":" + this.language,
                  "short_id": this.short_id,
                  "language": this.language,
                  "status": this.status,
                  "cues": this.cues.parse_json().catch(this.cues)
                }]
              } else { deleted() }
            } else if this.type() == "array" {
              if this.length() == 0 {
                deleted()
              } else {
                this.map_each(item -> {
                  "_id": item.short_id + ":" + item.language,
                  "short_id": item.short_id,
                  "language": item.language,
                  "status": item.status,
                  "cues": item.cues.parse_json().catch(item.cues)
                })
              }
            } else {
              deleted()
            }
        - unarchive:
            format: json_array

    output:
      fallback:
        - retry:
            max_retries: 5
            backoff:
              initial_interval: 1s
              max_interval: 30s
              max_elapsed_time: 5m
            output:
              switch:
                cases:
                  - check: 'this.status == "published"'
                    output:
                      mongodb:
                          url: "${MONGO_URL}"
                          database: pechka
                          collection: subtitles
                          operation: update-one
                          upsert: true
                          filter_map: 'root = {"_id": this._id}'
                          document_map: 'root = {"$set": this}'
                          write_concern:
                            w: "1"
                  - check: 'true'
                    output:
                      mongodb:
                          url: "${MONGO_URL}"
                          database: pechka
                          collection: subtitles
                          operation: delete-one
                          filter_map: 'root = {"_id": this._id}'
                          write_concern:
                            w: "1"
        - stdout: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: benthos
  namespace: pechka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: benthos
  template:
    metadata:
      labels:
        app: benthos
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4195"
        prometheus.io/path: "/metrics"
    spec:
      initContainers:
        - name: wait-for-mongodb
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z mongodb 27017; do echo "waiting for mongodb..."; sleep 2; done']
      containers:
        - name: benthos
          image: ghcr.io/redpanda-data/connect:latest
          args:
            - streams
            - /streams/contents.yaml
            - /streams/subtitles.yaml
          env:
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: pechka-config
                  key: postgres-host
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: pechka-config
                  key: postgres-port
            - name: SSL_MODE
              valueFrom:
                configMapKeyRef:
                  name: pechka-config
                  key: ssl-mode
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
            - name: POSTGRES_DSN
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)?sslmode=$(SSL_MODE)"
            - name: MONGO_HOST
              valueFrom:
                configMapKeyRef:
                  name: pechka-config
                  key: mongo-host
            - name: MONGO_PORT
              valueFrom:
                configMapKeyRef:
                  name: pechka-config
                  key: mongo-port
            - name: MONGO_USER
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGO_INITDB_ROOT_USERNAME
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGO_INITDB_ROOT_PASSWORD
            - name: MONGO_DB
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGO_INITDB_DATABASE
            - name: MONGO_URL
              value: "mongodb://$(MONGO_USER):$(MONGO_PASSWORD)@$(MONGO_HOST):$(MONGO_PORT)/$(MONGO_DB)?authSource=admin&w=1"
            - name: ELASTICSEARCH_URL
              valueFrom:
                configMapKeyRef:
                  name: pechka-config
                  key: elasticsearch-url
          ports:
            - containerPort: 4195
              name: http
          volumeMounts:
            - name: streams
              mountPath: /streams
          livenessProbe:
            httpGet:
              path: /ping
              port: 4195
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 4195
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: streams
          configMap:
            name: benthos-streams
---
apiVersion: v1
kind: Service
metadata:
  name: benthos
  namespace: pechka
spec:
  selector:
    app: benthos
  ports:
    - port: 4195
      targetPort: 4195
      name: http
