apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: pechka
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
      annotations:
        prometheus.io/scrape: "false"
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: nginx
      terminationGracePeriodSeconds: 300
      containers:
        - name: nginx
          image: nginx:1.30-alpine
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sleep", "5"]
          ports:
            - name: http
              containerPort: 80
            - name: s3
              containerPort: 9000
          env:
            - name: S3_ENDPOINT_1
              valueFrom:
                configMapKeyRef:
                  name: pechka-config
                  key: s3-endpoint-1
            - name: S3_ENDPOINT_2
              valueFrom:
                configMapKeyRef:
                  name: pechka-config
                  key: s3-endpoint-2
            - name: S3_ENDPOINT_3
              valueFrom:
                configMapKeyRef:
                  name: pechka-config
                  key: s3-endpoint-3
            - name: S3_FALLBACK_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: pechka-config
                  key: s3-fallback-endpoint
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: config
              mountPath: /etc/nginx/templates/upstream.conf.template
              subPath: upstream.conf.template
            - name: conf-d
              mountPath: /etc/nginx/conf.d
            - name: cache
              mountPath: /var/cache/nginx
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: nginx-config
        - name: conf-d
          emptyDir: {}
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: pechka
spec:
  selector:
    app: nginx
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: s3
      port: 9000
      targetPort: 9000
  type: ClusterIP
