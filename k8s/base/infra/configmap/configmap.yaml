apiVersion: v1
kind: ConfigMap
metadata:
  name: pechka-config
data:
  postgres-host: "postgres"
  postgres-host-1: "postgres"
  postgres-host-2: "postgres"
  postgres-host-3: "postgres"
  postgres-port: "5432"
  ssl-mode: "disable"
  mongo-host: "mongodb"
  mongo-port: "27017"
  elasticsearch-url: "http://elasticsearch:9200"
  minio-url: "nginx:9000"
  minio-bucket: "pechka"
  allowed-ip-range: "0.0.0.0/0"
  s3-endpoint-1: "minio:9000"
  s3-endpoint-2: "minio:9000"
  s3-endpoint-3: "minio:9000"
  s3-fallback-endpoint-1: "minio:9000"
  s3-fallback-endpoint-2: "minio:9000"
  s3-fallback-endpoint-3: "minio:9000"
  bare-web-proxy-url: "http://bare-web-proxy-service.bare-web-proxy.svc.cluster.local"
  openai-model: "preview/Kimi-K2.6"
  openai-base-url: "https://api.ai.sakura.ad.jp/v1"
