apiVersion: v1
kind: ConfigMap
metadata:
  name: pechka-config
data:
  postgres-host: "postgres"
  postgres-port: "5432"
  ssl-mode: "disable"
  mongo-host: "mongodb"
  mongo-port: "27017"
  elasticsearch-url: "http://elasticsearch:9200"
  minio-url: "minio:9000"
  minio-bucket: "pechka"
  allowed-ip-range: "0.0.0.0/0"
  bare-web-proxy-url: "http://bare-web-proxy-service.bare-web-proxy.svc.cluster.local"
  openai-model: "gemini-3.5-flash"
  openai-base-url: "https://generativelanguage.googleapis.com/v1beta/openai/"
