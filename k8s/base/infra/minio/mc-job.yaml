# S3 互換ストレージ (実体は nuage-cluster の swfs-cluster) の初期構築を残した Job。
# 何度実行しても同じ結果になるよう、存在を確認してから作成する (冪等)。
#
# 匿名読み取り (resources/hls/ と thumbnails/) はこの Job では設定できない。
# nuage-cluster の nix/hosts/swfs-cluster/swfs.nix (s3.json の anonymous identity) で宣言している。
# 以前の MinIO では `mc anonymous set download` で設定していた。
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-setup
  namespace: pechka
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-minio
          image: curlimages/curl:latest
          env:
            - name: S3_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: minio-setup-config
                  key: s3-endpoint
          command:
            - sh
            - -c
            - |
              target_url="http://${S3_ENDPOINT:?S3_ENDPOINT is required}"
              # PreSync フェーズで S3 バックエンドに直接疎通確認を行い、応答があるまで待つ
              while true; do
                code=$(curl -s -o /dev/null -w '%{http_code}' -m 5 "$target_url/" || echo "000")
                if [ "$code" != "000" ] && [ "$code" -lt 500 ]; then
                  echo "S3 is ready (HTTP $code)"
                  break
                fi
                echo "Waiting for S3 backend at $target_url (status: $code)..."
                sleep 5
              done
      containers:
        - name: s3-setup
          image: curlimages/curl:latest
          env:
            - name: S3_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: minio-setup-config
                  key: s3-endpoint
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ROOT_PASSWORD
          command:
            - sh
            - -c
            - |
              set -eu
              req() {
                curl -s -o /dev/null -w '%{http_code}' -m 20 \
                  --aws-sigv4 'aws:amz:us-east-1:s3' \
                  --user "$MINIO_ROOT_USER:$MINIO_ROOT_PASSWORD" "$@"
              }
              bucket=pechka
              target_url="http://${S3_ENDPOINT:?S3_ENDPOINT is required}"
              if [ "$(req -I "$target_url/$bucket")" = "200" ]; then
                echo "bucket $bucket: already exists"
              else
                code=$(req -X PUT "$target_url/$bucket")
                [ "$code" = "200" ] || { echo "bucket $bucket: create failed (HTTP $code)"; exit 1; }
                echo "bucket $bucket: created"
              fi
              echo "S3 setup complete"
