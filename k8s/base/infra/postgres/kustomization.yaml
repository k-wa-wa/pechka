apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - migrate-job.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: postgres-migrations
    namespace: pechka
    files:
      - 001_create_tables.up.sql=migrations/001_create_tables.up.sql
      - 002_add_unique_disc_title.up.sql=migrations/002_add_unique_disc_title.up.sql
      - 003_add_thumbnail_key.up.sql=migrations/003_add_thumbnail_key.up.sql
      - 004_add_subtitles.up.sql=migrations/004_add_subtitles.up.sql
      - 005_add_archived_at.up.sql=migrations/005_add_archived_at.up.sql
    options:
      # このConfigMapに非hookのままだと、Argo CDの通常Syncフェーズ（PreSyncの後）で
      # 適用される。postgres-migrate Job（PreSyncフック）はそれより先に走るため、
      # 同一コミットでマイグレーションファイルを追加した回だけ、Jobが更新前の
      # ConfigMap内容を読んでしまい、新しいマイグレーションが適用されない。
      # ConfigMap自体もPreSyncフックにし、Jobより小さいsync-waveを与えることで、
      # 同一Sync内で必ずConfigMap更新→Job実行の順になるようにする。
      annotations:
        argocd.argoproj.io/hook: PreSync
        argocd.argoproj.io/sync-wave: "-1"
