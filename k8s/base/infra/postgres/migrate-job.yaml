apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-migrate
  namespace: pechka
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    # postgres-migrations ConfigMap（sync-wave: "-1"）より後に実行させるため明示する。
    # デフォルトは "0" なので実質変更なしだが、依存関係を分かるように残す。
    argocd.argoproj.io/sync-wave: "0"
spec:
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: postgres:16
          command:
            - sh
            - -c
            - |
              if command -v getent >/dev/null 2>&1; then
                ips=$(getent ahostsv4 "$PGHOST" 2>/dev/null | awk '{print $1}' | sort -u | paste -sd, -)
                [ -n "$ips" ] && export PGHOST="$ips"
              fi
              echo "Connecting to postgres at $PGHOST..."
              until pg_isready -h "$PGHOST"; do echo "waiting for postgres..."; sleep 2; done
          env:
            - name: PGHOST
              valueFrom:
                configMapKeyRef:
                  name: postgres-migrate-config
                  key: POSTGRES_HOSTS
            - name: PGCONNECT_TIMEOUT
              value: "3"
            - name: PGTARGETSESSIONATTRS
              value: "read-write"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
      containers:
        - name: migrate
          image: postgres:16
          command:
            - sh
            - -c
            - |
              if command -v getent >/dev/null 2>&1; then
                ips=$(getent ahostsv4 "$PGHOST" 2>/dev/null | awk '{print $1}' | sort -u | paste -sd, -)
                [ -n "$ips" ] && export PGHOST="$ips"
              fi
              echo "Migrating with PGHOST=$PGHOST..."
              set -e
              for f in $(ls /migrations/*.up.sql | sort); do
                echo "Applying $f..."
                psql -v ON_ERROR_STOP=1 -h "$PGHOST" -f "$f"
              done
          env:
            - name: PGHOST
              valueFrom:
                configMapKeyRef:
                  name: postgres-migrate-config
                  key: POSTGRES_HOSTS
            - name: PGCONNECT_TIMEOUT
              value: "3"
            - name: PGTARGETSESSIONATTRS
              value: "read-write"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: migrations
              mountPath: /migrations
      volumes:
        - name: migrations
          configMap:
            name: postgres-migrations
