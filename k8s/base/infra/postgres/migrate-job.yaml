apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-migrate
  namespace: pechka
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    # postgres-migrations ConfigMap（sync-wave: "-1"）より後に実行させるため明示する。
    # デフォルトは "0" なので実質変更なしだが、依存関係を分かるように残す。
    argocd.argoproj.io/sync-wave: "0"
spec:
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: postgres:16
          command:
            - sh
            - -c
            - until pg_isready -d "$POSTGRES_DSN"; do echo "waiting for postgres..."; sleep 2; done
          env:
            - name: POSTGRES_HOST_1
              valueFrom:
                configMapKeyRef:
                  name: pechka-config
                  key: postgres-host-1
            - name: POSTGRES_HOST_2
              valueFrom:
                configMapKeyRef:
                  name: pechka-config
                  key: postgres-host-2
            - name: POSTGRES_HOST_3
              valueFrom:
                configMapKeyRef:
                  name: pechka-config
                  key: postgres-host-3
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: pechka-config
                  key: postgres-port
            - name: SSL_MODE
              valueFrom:
                configMapKeyRef:
                  name: pechka-config
                  key: ssl-mode
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
            - name: POSTGRES_DSN
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST_1):$(POSTGRES_PORT),$(POSTGRES_HOST_2):$(POSTGRES_PORT),$(POSTGRES_HOST_3):$(POSTGRES_PORT)/$(POSTGRES_DB)?target_session_attrs=read-write&sslmode=$(SSL_MODE)&connect_timeout=3"
      containers:
        - name: migrate
          image: postgres:16
          command:
            - sh
            - -c
            - for f in $(ls /migrations/*.up.sql | sort); do echo "Applying $f..."; psql "$POSTGRES_DSN" -f "$f"; done
          env:
            - name: POSTGRES_HOST_1
              valueFrom:
                configMapKeyRef:
                  name: pechka-config
                  key: postgres-host-1
            - name: POSTGRES_HOST_2
              valueFrom:
                configMapKeyRef:
                  name: pechka-config
                  key: postgres-host-2
            - name: POSTGRES_HOST_3
              valueFrom:
                configMapKeyRef:
                  name: pechka-config
                  key: postgres-host-3
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: pechka-config
                  key: postgres-port
            - name: SSL_MODE
              valueFrom:
                configMapKeyRef:
                  name: pechka-config
                  key: ssl-mode
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
            - name: POSTGRES_DSN
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST_1):$(POSTGRES_PORT),$(POSTGRES_HOST_2):$(POSTGRES_PORT),$(POSTGRES_HOST_3):$(POSTGRES_PORT)/$(POSTGRES_DB)?target_session_attrs=read-write&sslmode=$(SSL_MODE)&connect_timeout=3"
          volumeMounts:
            - name: migrations
              mountPath: /migrations
      volumes:
        - name: migrations
          configMap:
            name: postgres-migrations
