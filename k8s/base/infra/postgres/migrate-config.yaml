# postgres-migrate (PreSync フック) の接続先。
# pechka-config は通常 Sync で作られるため、PreSync の Job から参照すると、namespace が作り直された
# 場合 (DR 等) に ConfigMap が無く CreateContainerConfigError のまま PreSync が終わらない。
# postgres-migrations / postgres-secret と同じ理由で PreSync フック化し、
# Job より小さい sync-wave を与える。
# 通常時は prod overlay でマルチホスト (10.20.1.41,10.20.1.42,10.20.1.43) に上書きする。
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-migrate-config
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
data:
  POSTGRES_HOSTS: "postgres"
