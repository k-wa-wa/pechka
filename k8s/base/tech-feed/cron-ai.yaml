apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: tech-feed-daily-ai
  namespace: pechka
spec:
  # 毎日 JST 06:00 (UTC 21:00) 実行予定
  schedule: "0 21 * * *"
  timezone: "Asia/Tokyo"
  suspend: false
  concurrencyPolicy: "Forbid"
  startingDeadlineSeconds: 3600
  workflowSpec:
    workflowTemplateRef:
      name: tech-feed
    arguments:
      parameters:
        - name: sources-config
          value: "tech-feed-sources-ai"
        - name: since-days
          value: "2"
        - name: topics
          value: "3"
