apiVersion: apps/v1
kind: Deployment
metadata:
  name: aivisspeech
  namespace: pechka
  labels:
    app.kubernetes.io/name: aivisspeech
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aivisspeech
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aivisspeech
    spec:
      containers:
        - name: aivisspeech
          image: ghcr.io/aivis-project/aivisspeech-engine:latest
          ports:
            - containerPort: 10101
              name: http
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /version
              port: 10101
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /version
              port: 10101
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: aivisspeech
  namespace: pechka
  labels:
    app.kubernetes.io/name: aivisspeech
spec:
  type: ClusterIP
  ports:
    - port: 10101
      targetPort: 10101
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: aivisspeech
