# Bluray 取り込み（etl-bluray）と同じく Argo Workflows の WorkflowTemplate である。
# argo submit --from workflowtemplate/tech-feed で呼び出す。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pechka

resources:
  - workflow.yaml
  - aivisspeech.yaml

configurations:
  - kustomize-config.yaml

configMapGenerator:
  # 名前にハッシュが付くため、sources.json 等の中身を変更すると WorkflowTemplate の spec も更新・再生成される。
  - name: tech-feed-sources
    namespace: pechka
    files:
      - sources.json=sources.json
