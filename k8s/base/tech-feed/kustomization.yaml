# Bluray 取り込み（etl-bluray）と同じく Argo Workflows の WorkflowTemplate および CronWorkflow である。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pechka

resources:
  - workflow.yaml
  - aivisspeech.yaml
  - cron-ai.yaml
  - cron-k8s.yaml

configurations:
  - kustomize-config.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: tech-feed-sources-ai
    namespace: pechka
    files:
      - sources.json=sources-ai.json
      - prompt.txt=prompt-ai.txt
  - name: tech-feed-sources-k8s
    namespace: pechka
    files:
      - sources.json=sources-k8s.json
      - prompt.txt=prompt-k8s.txt
