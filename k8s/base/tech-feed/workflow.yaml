apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: tech-feed
  namespace: pechka
spec:
  # Bluray 取り込み（etl-bluray）とは完全に独立している。イメージも DB の同一性キーも
  # 共有しておらず、片方を止めても他方に影響しない。共有するのは配信先だけ
  # （MinIO の resources/hls と PostgreSQL の contents）。
  entrypoint: daily
  arguments:
    parameters:
      - name: topics
        value: "3"
      - name: since-days
        value: "2"
      # 音声合成エンジン(AivisSpeech / VOICEVOX Engine)を使用する。
      - name: tts-engine
        value: "voicevox"
      # AivisSpeech Speaker ID (デフォルト: 888753760 - まお / ノーマル)
      - name: speaker
        value: "888753760"
      # 再実行してもコンテンツが増えないための同一性キー。
      # 空なら台本の digest_date から tech-feed:<date> が組み立てられる。
      - name: source-key
        value: ""

  templates:
    # 1. daily (Collect/Pipeline -> Produce)
    - name: daily
      inputs:
        parameters:
          - name: topics
          - name: since-days
          - name: tts-engine
          - name: speaker
          - name: source-key
      dag:
        tasks:
          - name: collect
            template: collect
            arguments:
              parameters:
                - name: since-days
                  value: "{{inputs.parameters.since-days}}"
                - name: topics
                  value: "{{inputs.parameters.topics}}"
          - name: produce
            dependencies: [collect]
            template: produce
            arguments:
              parameters:
                - name: tts-engine
                  value: "{{inputs.parameters.tts-engine}}"
                - name: speaker
                  value: "{{inputs.parameters.speaker}}"
                - name: source-key
                  value: "{{inputs.parameters.source-key}}"
              artifacts:
                - name: script
                  raw:
                    data: "{{tasks.collect.outputs.parameters.script}}"

    # 2. collect (Gathers article candidates, filters trends, verifies primary sources, and composes script.json)
    - name: collect
      inputs:
        parameters:
          - name: since-days
          - name: topics
      activeDeadlineSeconds: 1800
      container:
        image: ghcr.io/k-wa-wa/pechka/tech-feed-collect:latest
        imagePullPolicy: Always
        args:
          - "pipeline"
          - "-sources"
          - "/etc/tech-feed/sources.json"
          - "-since-days"
          - "{{inputs.parameters.since-days}}"
          - "-topics"
          - "{{inputs.parameters.topics}}"
          - "-output"
          - "/tmp/script.json"
        resources:
          requests:
            cpu: "100m"
            memory: 128Mi
          limits:
            cpu: "500m"
            memory: 512Mi
        env:
          - name: OPENAI_API_KEY
            valueFrom:
              secretKeyRef:
                name: openai-secret
                key: OPENAI_API_KEY
                optional: true
          - name: OPENAI_BASE_URL
            valueFrom:
              configMapKeyRef:
                name: pechka-config
                key: openai-base-url
                optional: true
          - name: BARE_WEB_PROXY_URL
            valueFrom:
              configMapKeyRef:
                name: pechka-config
                key: bare-web-proxy-url
                optional: true
          - name: OPENAI_MODEL
            valueFrom:
              configMapKeyRef:
                name: pechka-config
                key: openai-model
                optional: true

      outputs:
        parameters:
          - name: script
            valueFrom:
              path: /tmp/script.json

    # 3. produce (Synthesize -> Render -> Publish)
    #    中間成果物（wav 群・mp4・HLS セグメント）が大きく段をまたげないため、
    #    ここは1コンテナで通す。
    - name: produce
      inputs:
        parameters:
          - name: tts-engine
          - name: speaker
          - name: source-key
        artifacts:
          - name: script
            path: /tmp/script.json
      activeDeadlineSeconds: 10800
      container:
        image: ghcr.io/k-wa-wa/pechka/tech-feed-produce:latest
        imagePullPolicy: Always
        args:
          - "all"
          - "--script"
          - "/tmp/script.json"
          - "--out"
          - "/work"
          - "--engine"
          - "{{inputs.parameters.tts-engine}}"
          - "--speaker"
          - "{{inputs.parameters.speaker}}"
          - "--source-key"
          - "{{inputs.parameters.source-key}}"
          - "--quiet"
        resources:
          requests:
            cpu: "2"
            memory: 4Gi
          limits:
            cpu: "4"
            memory: 8Gi
        volumeMounts:
          - name: work
            mountPath: /work
        env: &publish-env
          - name: MINIO_BUCKET
            valueFrom:
              configMapKeyRef:
                name: pechka-config
                key: minio-bucket
          - name: MINIO_URL
            valueFrom:
              configMapKeyRef:
                name: pechka-config
                key: minio-url
          - name: MINIO_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: minio-secret
                key: MINIO_ROOT_USER
          - name: MINIO_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: minio-secret
                key: MINIO_ROOT_PASSWORD
          - name: DB_HOST
            valueFrom:
              configMapKeyRef:
                name: pechka-config
                key: postgres-host
          - name: DB_PORT
            valueFrom:
              configMapKeyRef:
                name: pechka-config
                key: postgres-port
          - name: DB_USER
            valueFrom:
              secretKeyRef:
                name: postgres-secret
                key: POSTGRES_USER
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: postgres-secret
                key: POSTGRES_PASSWORD
          - name: DB_NAME
            valueFrom:
              secretKeyRef:
                name: postgres-secret
                key: POSTGRES_DB
          - name: SSL_MODE
            valueFrom:
              configMapKeyRef:
                name: pechka-config
                key: ssl-mode
          - name: POSTGRES_DSN
            value: "postgres://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)?sslmode=$(SSL_MODE)"
      volumes:
        - name: work
          emptyDir:
            sizeLimit: 8Gi

    # 4. from-script (Builds from a hand-written script; skips collect, filter, enrich, and compose)
    #    台本は ConfigMap（k8s/base/tech-feed/script.json）から来る。
    - name: from-script
      inputs:
        parameters:
          - name: tts-engine
            value: "voicevox"
          - name: speaker
            value: "888753760"
          - name: source-key
            value: ""
      activeDeadlineSeconds: 10800
      container:
        image: ghcr.io/k-wa-wa/pechka/tech-feed-produce:latest
        imagePullPolicy: Always
        args:
          - "all"
          - "--script"
          - "/scripts/script.json"
          - "--out"
          - "/work"
          - "--engine"
          - "{{inputs.parameters.tts-engine}}"
          - "--speaker"
          - "{{inputs.parameters.speaker}}"
          - "--source-key"
          - "{{inputs.parameters.source-key}}"
          - "--quiet"
        resources:
          requests:
            cpu: "2"
            memory: 4Gi
          limits:
            cpu: "4"
            memory: 8Gi
        volumeMounts:
          - name: work
            mountPath: /work
          - name: script
            mountPath: /scripts
            readOnly: true
        env: *publish-env
      volumes:
        - name: work
          emptyDir:
            sizeLimit: 8Gi
        - name: script
          configMap:
            name: tech-feed-script
