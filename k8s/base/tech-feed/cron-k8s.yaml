apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: tech-feed-weekly-k8s
  namespace: pechka
spec:
  # 毎週月曜 JST 08:00 (UTC 日曜 23:00) 実行予定
  schedule: "0 23 * * 0"
  timezone: "Asia/Tokyo"
  # 一旦自動実行しないよう一時停止状態に設定
  suspend: true
  concurrencyPolicy: "Forbid"
  startingDeadlineSeconds: 3600
  workflowSpec:
    workflowTemplateRef:
      name: tech-feed
    arguments:
      parameters:
        - name: sources-config
          value: "tech-feed-sources-k8s"
        - name: since-days
          value: "7"
        - name: topics
          value: "5"
