openapi: "3.0.3"
info:
  title: pechka API
  version: "1.0.0"

paths:
  /health:
    get:
      summary: ヘルスチェック
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /v1/channels:
    get:
      summary: チャンネル一覧取得
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Channel"

  /v1/channels/{id}:
    get:
      summary: チャンネル詳細取得
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "404":
          description: Not Found

  /v1/contents:
    get:
      summary: コンテンツ一覧取得
      parameters:
        - name: content_type
          in: query
          schema:
            $ref: "#/components/schemas/ContentType"
        - name: channel_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MongoContent"

  /v1/contents/{short_id}:
    get:
      summary: コンテンツ詳細取得
      parameters:
        - name: short_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MongoContent"
        "404":
          description: Not Found

  /v1/contents/{short_id}/variants:
    get:
      summary: 動画バリアント一覧取得
      parameters:
        - name: short_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MongoVariant"
        "404":
          description: Not Found

  /v1/search:
    get:
      summary: コンテンツ全文検索
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchResult"
        "400":
          description: Bad Request (q is required)

  /v1/admin/contents:
    get:
      summary: 管理用コンテンツ一覧取得
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ContentStatus"
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Content"
    post:
      summary: コンテンツ登録
      parameters:
        - name: X-Channel-Id
          in: header
          required: true
          description: 紐付けるチャンネルID (例: tech-feed, bluray)。必須。
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContentRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Content"
        "400":
          description: Bad Request

  /v1/admin/contents/upload:
    post:
      summary: 動画・ドキュメントファイルのアップロード
      parameters:
        - name: X-Channel-Id
          in: header
          required: false
          description: 紐付けるチャンネルID (例: tech-feed, bluray)。ヘッダーまたはフォームの channel_id で指定必須。
          schema:
            type: string
      description: >
        動画またはドキュメント(.md, .pdf)ファイルを multipart/form-data で受け取る。
        ・ドキュメント(.md, .markdown, .pdf)の場合: フォーマットおよびマジックバイトを検証の上、
          MinIO の公開領域 (`resources/documents/{short_id}/document.{ext}`) に保存し、
          content_type=document, status=ready として即時公開する (201 Created)。
        ・動画の場合: MinIO の一時領域 (`uploads/{short_id}/{filename}`) に保存した上で、
          content_type=video, status=pending のコンテンツを作成し、ETL の HLS 変換パイプライン
          (Argo Workflow)を起動する (202 Accepted)。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, title]
              properties:
                file:
                  type: string
                  format: binary
                  description: アップロードするファイル(動画: mp4 等 / ドキュメント: .md, .pdf)
                title:
                  type: string
                description:
                  type: string
                tags:
                  type: string
                  description: 'カンマ区切りのタグ一覧(例: "action,drama")'
                channel_id:
                  type: string
                  description: '紐付けるチャンネルID(X-Channel-Id ヘッダー未指定時のフォールバック)'
                content_type:
                  $ref: "#/components/schemas/ContentType"
      responses:
        "201":
          description: Created (ドキュメントの即時公開完了)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadVideoResponse"
        "202":
          description: Accepted (動画アップロード・変換ジョブ起動)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadVideoResponse"
        "400":
          description: Bad Request (file・title 未指定、未対応フォーマット、マジックバイト不一致等)
        "500":
          description: Internal Server Error (MinIO 接続失敗、Workflow 起動失敗等)

  /v1/admin/contents/{id}:
    put:
      summary: コンテンツ更新
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateContentRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Content"
        "404":
          description: Not Found
    delete:
      summary: コンテンツ削除
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content

  /v1/admin/contents/{id}/archive:
    post:
      summary: コンテンツをアーカイブ(論理削除)する
      description: >
        物理データは削除せず archived_at を設定する。
        アーカイブ済みコンテンツは admin画面以外(公開API/検索)から見えなくなる。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Content"
        "404":
          description: Not Found

  /v1/admin/contents/{id}/unarchive:
    post:
      summary: コンテンツのアーカイブを解除する
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Content"
        "404":
          description: Not Found

  /v1/admin/discs:
    get:
      summary: ディスク一覧取得
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Disc"
    post:
      summary: ディスク登録
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDiscRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Disc"
        "400":
          description: Bad Request

components:
  schemas:
    Channel:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ContentType:
      type: string
      enum: [video, image_gallery, vr360, document]

    ContentStatus:
      type: string
      enum: [pending, processing, ready, error]

    Content:
      type: object
      properties:
        id:
          type: string
        short_id:
          type: string
        content_type:
          $ref: "#/components/schemas/ContentType"
        channel_id:
          type: string
        disc_id:
          type: string
          nullable: true
        title:
          type: string
        description:
          type: string
        duration_seconds:
          type: integer
          nullable: true
        is_360:
          type: boolean
        tags:
          type: array
          items:
            type: string
        status:
          $ref: "#/components/schemas/ContentStatus"
        document_key:
          type: string
          nullable: true
          description: ドキュメントファイルのMinIOキー (例: resources/documents/{short_id}/document.md)
        document_mime_type:
          type: string
          nullable: true
          enum: [text/markdown, application/pdf]
          description: ドキュメントの正規化MIMEタイプ
        published_at:
          type: string
          format: date-time
          nullable: true
        archived_at:
          type: string
          format: date-time
          nullable: true
          description: アーカイブ(論理削除)された日時。nullの場合は未アーカイブ。
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MongoContent:
      type: object
      properties:
        short_id:
          type: string
        content_type:
          $ref: "#/components/schemas/ContentType"
        channel_id:
          type: string
        channel_name:
          type: string
        title:
          type: string
        description:
          type: string
        duration_seconds:
          type: integer
          nullable: true
        is_360:
          type: boolean
        tags:
          type: array
          items:
            type: string
        status:
          $ref: "#/components/schemas/ContentStatus"
        disc_label:
          type: string
          nullable: true
        thumbnail_key:
          type: string
          nullable: true
        document_key:
          type: string
          nullable: true
        document_mime_type:
          type: string
          nullable: true
        published_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time

    MongoVariant:
      type: object
      properties:
        variant_type:
          type: string
        hls_key:
          type: string
        bandwidth:
          type: integer
          nullable: true
        resolution:
          type: string
          nullable: true
        codecs:
          type: string
          nullable: true

    SearchResult:
      type: object
      properties:
        short_id:
          type: string
        title:
          type: string
        description:
          type: string
        content_type:
          $ref: "#/components/schemas/ContentType"
        tags:
          type: array
          items:
            type: string
        status:
          $ref: "#/components/schemas/ContentStatus"

    Disc:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        disc_name:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    CreateContentRequest:
      type: object
      required: [content_type, title]
      properties:
        content_type:
          $ref: "#/components/schemas/ContentType"
        disc_id:
          type: string
          nullable: true
        title:
          type: string
        description:
          type: string
        duration_seconds:
          type: integer
          nullable: true
        is_360:
          type: boolean
        tags:
          type: array
          items:
            type: string

    UpdateContentRequest:
      type: object
      properties:
        channel_id:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
          nullable: true
        status:
          $ref: "#/components/schemas/ContentStatus"

    CreateDiscRequest:
      type: object
      required: [label]
      properties:
        label:
          type: string
        disc_name:
          type: string
          nullable: true

    UploadVideoResponse:
      type: object
      properties:
        message:
          type: string
        workflow_name:
          type: string
        content:
          $ref: "#/components/schemas/Content"
