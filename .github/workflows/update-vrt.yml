name: Update VRT Snapshots

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pull-requests: read

jobs:
  update-snapshots:
    name: Update Snapshots
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      # 更新後に Frontend ワークフローへ渡す PR 番号を、push する前に求めておく。
      # GITHUB_TOKEN の push では pull_request のワークフローが起動しないため、後で workflow_dispatch で起動する。
      - name: Resolve PR number
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          NUMBERS=$(gh api "repos/${REPO}/pulls?state=open&head=${OWNER}:${BRANCH}" --jq '.[].number')
          COUNT=$(printf '%s' "$NUMBERS" | grep -c . || true)
          if [ "$COUNT" -ne 1 ]; then
            echo "::error::ブランチ ${BRANCH} の open な PR がちょうど 1 件ではない (${COUNT} 件)。PR を作ってから実行すること。"
            exit 1
          fi
          echo "PR #${NUMBERS}"
          echo "number=${NUMBERS}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Configure DNS and apt
        run: |
          sudo rm -f /etc/resolv.conf
          printf "nameserver 8.8.8.8\nnameserver 1.1.1.1\nnameserver 8.8.4.4\n" | sudo tee /etc/resolv.conf
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80-network

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Update Snapshots
        run: npm run test:vrt:update

      - name: Commit and push updated snapshots
        id: push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add e2e/vrt-snapshots/
          if git diff --cached --quiet; then
            echo "No changes in VRT snapshots."
          else
            git commit -m "chore: update VRT snapshots [skip ci]"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Frontend workflow
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: gh workflow run frontend.yml --repo "$REPO" --ref "$BRANCH" -f pr_number="$PR_NUMBER"
