name: K8s Manifest Lint

permissions:
  contents: read

on:
  push:
    branches: [master]
    paths:
      - 'k8s/**'
      - '.yamllint'
      - '.github/workflows/k8s.yml'
  pull_request:
    paths:
      - 'k8s/**'
      - '.yamllint'
      - '.github/workflows/k8s.yml'

jobs:
  validate-k8s:
    name: Validate K8s Manifests
    uses: k-wa-wa/nuage-workspace/.github/workflows/k8s-validate.yml@master
    with:
      yamllint-path: "k8s"
      prod-overlays: "k8s/overlays/prod"
      preview-overlays: "k8s/overlays/preview"
      fail-on-policy: true

  validate-pechka-specific:
    name: Validate Pechka Specific Checks
    runs-on: ubuntu-latest
    env:
      KUSTOMIZE_VERSION: "v5.8.3"
      KUSTOMIZE_SHA256: "cb9e31198d3f63b44848bd0afc4c8efc56e6cfef9c93a4a39a211940e6decd61"
      KUBECONFORM_VERSION: "v0.8.0"
      KUBECONFORM_SHA256: "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883"
      PLUTO_VERSION: "v5.24.5"
      PLUTO_SHA256: "80076e01a320e1f4db30f5dbc927d204e61cd8abed66fa0b4644ca61cd86b39e"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache K8s tools
        uses: actions/cache@v4
        with:
          path: ~/.local/pechka-k8s-tools
          key: pechka-k8s-tools-${{ runner.os }}-${{ env.KUSTOMIZE_VERSION }}-${{ env.KUBECONFORM_VERSION }}-${{ env.PLUTO_VERSION }}

      - name: Install tools
        run: |
          set -euo pipefail
          BIN_DIR="$HOME/.local/pechka-k8s-tools"
          mkdir -p "$BIN_DIR"
          echo "$BIN_DIR" >> "$GITHUB_PATH"

          DL_DIR="${{ runner.temp }}/pechka-k8s-dl"
          mkdir -p "$DL_DIR"

          download_and_verify() {
            local url="$1"
            local expected_sha="$2"
            local out_file="$3"
            curl -sSfL "$url" -o "$out_file"
            echo "${expected_sha}  ${out_file}" | sha256sum -c -
          }

          if [ ! -x "$BIN_DIR/kustomize" ]; then
            download_and_verify \
              "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
              "$KUSTOMIZE_SHA256" \
              "$DL_DIR/kustomize.tar.gz"
            tar -xz -f "$DL_DIR/kustomize.tar.gz" -C "$BIN_DIR" kustomize
          fi

          if [ ! -x "$BIN_DIR/kubeconform" ]; then
            download_and_verify \
              "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
              "$KUBECONFORM_SHA256" \
              "$DL_DIR/kubeconform.tar.gz"
            tar -xz -f "$DL_DIR/kubeconform.tar.gz" -C "$BIN_DIR" kubeconform
          fi

          if [ ! -x "$BIN_DIR/pluto" ]; then
            PLUTO_VER_NO_V="${PLUTO_VERSION#v}"
            download_and_verify \
              "https://github.com/FairwindsOps/pluto/releases/download/${PLUTO_VERSION}/pluto_${PLUTO_VER_NO_V}_linux_amd64.tar.gz" \
              "$PLUTO_SHA256" \
              "$DL_DIR/pluto.tar.gz"
            tar -xz -f "$DL_DIR/pluto.tar.gz" -C "$BIN_DIR" pluto
          fi

          rm -rf "$DL_DIR"

          if ! python3 -c "import yaml" >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends python3-yaml
          fi

      - name: Check env vars and PreSync dependencies
        run: python3 scripts/check-k8s-env-vars.py

      - name: Check prod S3 endpoint overrides
        run: |
          set -euo pipefail
          PROD_MANIFESTS=$(mktemp --suffix=.yaml)
          trap 'rm -f "$PROD_MANIFESTS"' EXIT
          kustomize build k8s/overlays/prod > "$PROD_MANIFESTS"
          if grep -qF 's3-fallback-endpoint: minio:9000' "$PROD_MANIFESTS"; then
            echo "❌ prod pechka-config has unresolved base fallback endpoint 'minio:9000' (minio service does not exist in prod)!"
            exit 1
          fi
          if grep -qF 's3-endpoint: minio:9000' "$PROD_MANIFESTS"; then
            echo "❌ prod pechka-config has unresolved base endpoint 'minio:9000'!"
            exit 1
          fi

      - name: Validate preview-secret overlay
        run: |
          set -euo pipefail
          SECRET_MANIFESTS=$(mktemp --suffix=.yaml)
          trap 'rm -f "$SECRET_MANIFESTS"' EXIT
          kustomize build k8s/overlays/preview-secret > "$SECRET_MANIFESTS"
          kubeconform -summary -strict -ignore-missing-schemas \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            "$SECRET_MANIFESTS"
          pluto detect "$SECRET_MANIFESTS"
