name: CD / Build and Push Docker Images

on:
  push:
    branches:
      - master
    paths:
      - 'api/**'
      - 'frontend/**'
      - 'batch/**'
      - '.github/workflows/cd-docker.yml'

permissions:
  contents: read
  packages: write

jobs:
  # 変更されたパスから、どのイメージを再ビルドすべきかを判定する。
  # api/frontend は Keel (2分間隔ポーリング, force policy) で自動デプロイされるため、
  # 無関係な変更で latest イメージが再pushされると、コード変更が無くても本番Podが
  # 再起動してしまう。matrix全体を無条件に回さず、実際に変更のあったコンポーネントだけ
  # ビルドする。
  changes:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
            frontend:
              - 'frontend/**'
            etl-extract:
              - 'batch/etl/**'
            etl-transform:
              - 'batch/etl/**'
            etl-load:
              - 'batch/etl/**'
            etl-generate-thumbnail:
              - 'batch/generate-thumbnail/**'
            etl-subtitle:
              - 'batch/subtitle/**'
            etl-refresh-latest-playlist:
              - 'batch/refresh-latest-playlist/**'

  build-and-push:
    needs: changes
    if: needs.changes.outputs.list != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: ./api
            image: ghcr.io/${{ github.repository }}-api
          - name: frontend
            context: ./frontend
            image: ghcr.io/${{ github.repository }}-frontend
          - name: etl-extract
            context: .
            file: ./batch/etl/Dockerfile.extract
            image: ghcr.io/${{ github.repository }}/etl-extract
          - name: etl-transform
            context: .
            file: ./batch/etl/Dockerfile.transform
            image: ghcr.io/${{ github.repository }}/etl-transform
          - name: etl-load
            context: .
            file: ./batch/etl/Dockerfile.load
            image: ghcr.io/${{ github.repository }}/etl-load
          - name: etl-generate-thumbnail
            context: ./batch/generate-thumbnail
            image: ghcr.io/${{ github.repository }}/etl-generate-thumbnail
          - name: etl-subtitle
            context: ./batch/subtitle
            image: ghcr.io/${{ github.repository }}/etl-subtitle
          - name: etl-refresh-latest-playlist
            context: ./batch/refresh-latest-playlist
            image: ghcr.io/${{ github.repository }}/etl-refresh-latest-playlist

    steps:
      - name: Checkout repository
        if: contains(fromJSON(needs.changes.outputs.list), matrix.name)
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: contains(fromJSON(needs.changes.outputs.list), matrix.name)
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: contains(fromJSON(needs.changes.outputs.list), matrix.name)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: contains(fromJSON(needs.changes.outputs.list), matrix.name)
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
