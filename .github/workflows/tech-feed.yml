name: Tech Feed

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [master]
    tags:
      - 'v*.*.*'
    paths:
      - 'batch-tech-feed/**'
      - 'k8s/base/tech-feed/**'
      - '.github/workflows/tech-feed.yml'
  pull_request:

jobs:
  detect-changes:
    name: Detect Changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed files
        id: filter
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -Eq '^(batch-tech-feed/|k8s/base/tech-feed/|\.github/workflows/tech-feed\.yml$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  test-collect:
    name: Test (Tech Feed Collect)
    needs: [detect-changes]
    if: |
      always() && (
        github.event_name == 'push' ||
        (github.event_name == 'pull_request' && needs.detect-changes.result == 'success' && needs.detect-changes.outputs.changed == 'true')
      )
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: batch-tech-feed/collect
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: batch-tech-feed/collect/go.mod
          cache-dependency-path: batch-tech-feed/collect/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Go Format Check
        run: test -z "$(gofmt -s -l .)"

      - name: Go Vet
        run: go vet ./...

      - name: Build
        run: CGO_ENABLED=0 go build ./...

      - name: Test
        run: CGO_ENABLED=0 go test ./...

  test-produce:
    name: Test (Tech Feed Produce)
    needs: [detect-changes]
    if: |
      always() && (
        github.event_name == 'push' ||
        (github.event_name == 'pull_request' && needs.detect-changes.result == 'success' && needs.detect-changes.outputs.changed == 'true')
      )
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: batch-tech-feed/produce
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: batch-tech-feed/produce/go.mod
          cache-dependency-path: batch-tech-feed/produce/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Go Format Check
        run: test -z "$(gofmt -s -l .)"

      - name: Go Vet
        run: go vet ./...

      - name: Build
        run: CGO_ENABLED=0 go build ./...

      - name: Test
        run: CGO_ENABLED=0 go test ./...

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: batch-tech-feed/produce/remotion/package-lock.json

      - name: Install Remotion dependencies
        run: |
          cd remotion
          npm ci

  push-image:
    name: Push Image
    needs: [detect-changes, test-collect, test-produce]
    if: |
      always() && (
        (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref_type == 'tag')) ||
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.detect-changes.result == 'success' && needs.detect-changes.outputs.changed == 'true' && needs.test-collect.result == 'success' && needs.test-produce.result == 'success')
      )
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tech-feed-collect
            context: ./batch-tech-feed/collect
            file: ./batch-tech-feed/collect/Dockerfile
            image: ghcr.io/${{ github.repository }}/tech-feed-collect
          - name: tech-feed-produce
            context: ./batch-tech-feed/produce
            file: ./batch-tech-feed/produce/Dockerfile
            image: ghcr.io/${{ github.repository }}/tech-feed-produce

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tags
        id: tags
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SUFFIX="pr-${{ github.event.pull_request.number }}"
            SHA="${{ github.event.pull_request.head.sha }}"
          else
            SUFFIX="latest"
            SHA="${{ github.sha }}"
          fi
          {
            echo "tags<<EOF"
            echo "${{ matrix.image }}:${SUFFIX}"
            echo "${{ matrix.image }}:sha-${SHA}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          pull: true
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # tech-feed に触れない PR でも preview 用の :pr-<N> タグを欠かさないため、
  # :latest のマニフェストをビルドなしで付け替える。
  retag-preview-image:
    name: Tag Preview Image (:latest -> :pr-N)
    needs: [detect-changes]
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.changed == 'false'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tech-feed-collect
            image: ghcr.io/${{ github.repository }}/tech-feed-collect
          - name: tech-feed-produce
            image: ghcr.io/${{ github.repository }}/tech-feed-produce
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag latest image for PR preview
        run: |
          docker buildx imagetools create \
            -t "${{ matrix.image }}:pr-${{ github.event.pull_request.number }}" \
            "${{ matrix.image }}:latest"
