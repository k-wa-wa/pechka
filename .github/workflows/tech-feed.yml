name: Tech Feed

permissions:
  contents: read
  packages: write
  pull-requests: write

on:
  push:
    branches: [master]
    tags:
      - 'v*.*.*'
    paths:
      - 'batch-tech-feed/**'
      - 'k8s/base/tech-feed/**'
      - '.github/workflows/tech-feed.yml'
  pull_request:
    paths:
      - 'batch-tech-feed/**'
      - 'k8s/base/tech-feed/**'
      - '.github/workflows/tech-feed.yml'

jobs:
  test-collect:
    name: Test (Tech Feed Collect)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: batch-tech-feed/collect
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: batch-tech-feed/collect/go.mod
          cache-dependency-path: batch-tech-feed/collect/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: CGO_ENABLED=0 go build ./...

  test-produce:
    name: Test (Tech Feed Produce)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: batch-tech-feed/produce
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: batch-tech-feed/produce/go.mod
          cache-dependency-path: batch-tech-feed/produce/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: CGO_ENABLED=0 go build ./...

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: batch-tech-feed/produce/remotion/package-lock.json

      - name: Install Remotion dependencies
        run: |
          cd remotion
          npm ci

  push-image:
    name: Push Image (${{ matrix.name }})
    needs: [test-collect, test-produce]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tech-feed-collect
            context: ./batch-tech-feed/collect
          - name: tech-feed-produce
            context: ./batch-tech-feed/produce
    uses: k-wa-wa/nuage-workspace/.github/workflows/docker-build-push.yml@master
    with:
      context: ${{ matrix.context }}
      image: ghcr.io/${{ github.repository }}/${{ matrix.name }}
