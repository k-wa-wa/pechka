name: Frontend

permissions:
  contents: read
  pull-requests: write
  packages: write

on:
  push:
    branches: [master]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
  # Update VRT Snapshots が GITHUB_TOKEN で push した後に起動する（その push では pull_request が起動しないため）。
  workflow_dispatch:
    inputs:
      pr_number:
        description: "プレビューを更新する PR 番号（dispatch したブランチの PR）。空ならテストだけ走らせる"
        required: false
        type: string

jobs:
  # プレビュー系のジョブが使う PR 番号と head SHA を求める。空ならプレビュー系は走らない。
  pr-context:
    name: Resolve PR context
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.resolve.outputs.number }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
    steps:
      - name: Resolve PR number and head SHA
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)
              if [ "$EVENT_PR_HEAD_REPO" != "$REPO" ]; then
                echo "フォークからの PR なのでプレビューは作らない。"
                exit 0
              fi
              echo "number=${EVENT_PR_NUMBER}" >> "$GITHUB_OUTPUT"
              echo "head_sha=${EVENT_PR_HEAD_SHA}" >> "$GITHUB_OUTPUT"
              ;;
            workflow_dispatch)
              if [ -z "$INPUT_PR_NUMBER" ]; then
                echo "pr_number が無いのでテストだけ走らせる。"
                exit 0
              fi
              if ! printf '%s' "$INPUT_PR_NUMBER" | grep -Eq '^[0-9]+$'; then
                echo "::error::pr_number が数字ではない: ${INPUT_PR_NUMBER}"
                exit 1
              fi
              PR_JSON=$(gh api "repos/${REPO}/pulls/${INPUT_PR_NUMBER}")
              STATE=$(printf '%s' "$PR_JSON" | jq -r '.state')
              HEAD_REPO=$(printf '%s' "$PR_JSON" | jq -r '.head.repo.full_name')
              HEAD_REF=$(printf '%s' "$PR_JSON" | jq -r '.head.ref')
              if [ "$STATE" != "open" ] || [ "$HEAD_REPO" != "$REPO" ] || [ "$HEAD_REF" != "$REF_NAME" ]; then
                echo "::error::PR #${INPUT_PR_NUMBER} (state=${STATE}, head=${HEAD_REPO}:${HEAD_REF}) は ${REPO}:${REF_NAME} の open な PR ではない。"
                exit 1
              fi
              # dispatch のチェックアウトはブランチの head（= github.sha）なので、それをイメージのタグに使う。
              echo "number=${INPUT_PR_NUMBER}" >> "$GITHUB_OUTPUT"
              echo "head_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
              ;;
          esac

  test-frontend:
    name: Test (Frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Biome Lint & Format Check
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Check Storybook story coverage
        run: npm run check:stories

      - name: Check Unit Test coverage
        run: npm run check:tests

      - name: Unit Tests
        run: npm run test

      - name: Build Storybook
        run: npm run build-storybook

      - name: Upload Storybook build
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: frontend/storybook-static/
          retention-days: 14

      - name: Build
        run: npm run build

  test-vrt:
    name: Test (VRT)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run VRT
        run: npm run test:vrt

      - name: Upload VRT results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vrt-snapshots
          path: frontend/e2e/vrt-snapshots/
          retention-days: 14

  push-preview-image:
    name: Push Preview Image
    needs: [pr-context, test-frontend, test-vrt]
    if: always() && needs.test-frontend.result == 'success' && (needs.test-vrt.result == 'success' || needs.test-vrt.result == 'failure') && needs.pr-context.result == 'success' && needs.pr-context.outputs.number != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push preview Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-frontend:pr-${{ needs.pr-context.outputs.number }}
            ghcr.io/${{ github.repository }}-frontend:sha-${{ needs.pr-context.outputs.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Comment VRT report link on PR
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.pr-context.outputs.number }}
        run: |
          COMMENT_ID=$(gh api repos/${{ github.repository }}/issues/"${PR_NUMBER}"/comments --jq '.[] | select(.body | contains("🎭 VRT Report")) | .id' | head -n 1)

          COMMENT_BODY=$(cat <<EOF
          ### 🌐 プレビュー
          🔗 [トップページ](https://pechka-pr-${PR_NUMBER}.wpcapp.net/)

          ### 🎭 VRT Report (Playwright)
          VRT の実行結果はプレビュー環境で確認できます：
          🔗 [VRT Report](https://pechka-pr-${PR_NUMBER}.wpcapp.net/vrt-report/index.html)

          ※ UIの更新が意図通りである場合は、GitHub Actions の \`Update VRT Snapshots\` ワークフローを実行してスナップショットを更新してください。

          ### 📚 Storybook
          🔗 [Storybook](https://pechka-pr-${PR_NUMBER}.wpcapp.net/storybook/)
          EOF
          )

          if [ -n "$COMMENT_ID" ]; then
            gh api -X PATCH repos/${{ github.repository }}/issues/comments/"${COMMENT_ID}" -f body="$COMMENT_BODY"
          else
            gh pr comment "$PR_NUMBER" --body "$COMMENT_BODY"
          fi

  push-vrt-report-image:
    name: Push VRT Report Image
    needs: [pr-context, test-frontend, test-vrt]
    if: always() && needs.test-frontend.result == 'success' && (needs.test-vrt.result == 'success' || needs.test-vrt.result == 'failure') && needs.pr-context.result == 'success' && needs.pr-context.outputs.number != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download VRT report
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: vrt-report/playwright-report

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push VRT report Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./vrt-report
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-vrt-report:pr-${{ needs.pr-context.outputs.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  push-storybook-report-image:
    name: Push Storybook Report Image
    needs: [pr-context, test-frontend]
    if: needs.test-frontend.result == 'success' && needs.pr-context.outputs.number != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Storybook build
        uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: storybook-report/storybook-static

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Storybook report Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./storybook-report
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-storybook-report:pr-${{ needs.pr-context.outputs.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  push-image:
    name: Push Image
    needs: [test-frontend, test-vrt]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    uses: k-wa-wa/nuage-workspace/.github/workflows/docker-build-push.yml@master
    with:
      context: ./frontend
      image: ghcr.io/${{ github.repository }}-frontend
