name: Frontend

permissions:
  contents: read
  pull-requests: write
  packages: write

on:
  push:
    branches: [master]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:

jobs:
  test-frontend:
    name: Test (Frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Check Storybook story coverage
        run: npm run check:stories

      - name: Build Storybook
        run: npm run build-storybook

      - name: Build
        run: npm run build

  test-vrt:
    name: Test (VRT)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run VRT
        run: npm run test:vrt

      - name: Upload VRT results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vrt-snapshots
          path: frontend/e2e/vrt-snapshots/
          retention-days: 14

  push-preview-image:
    name: Push Preview Image
    needs: [test-frontend, test-vrt]
    if: always() && needs.test-frontend.result == 'success' && (needs.test-vrt.result == 'success' || needs.test-vrt.result == 'failure') && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download VRT report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: playwright-report
          path: frontend/public/vrt-report

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push preview Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-frontend:pr-${{ github.event.pull_request.number }}
            ghcr.io/${{ github.repository }}-frontend:sha-${{ github.event.pull_request.head.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Comment VRT report link on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          COMMENT_ID=$(gh api repos/${{ github.repository }}/issues/${PR_NUMBER}/comments --jq '.[] | select(.body | contains("🎭 VRT Report")) | .id' | head -n 1)

          COMMENT_BODY=$(cat <<EOF
          ### 🎭 VRT Report (Playwright)
          VRT の実行結果はプレビュー環境で確認できます：
          🔗 [VRT Report](https://pechka-pr-${PR_NUMBER}.wpcapp.net/vrt-report/index.html)

          ※ UIの更新が意図通りである場合は、GitHub Actions の \`Update VRT Snapshots\` ワークフローを実行してスナップショットを更新してください。
          EOF
          )

          if [ -n "$COMMENT_ID" ]; then
            gh api -X PATCH repos/${{ github.repository }}/issues/comments/${COMMENT_ID} -f body="$COMMENT_BODY"
          else
            gh pr comment "$PR_NUMBER" --body "$COMMENT_BODY"
          fi

  push-image:
    name: Push Image
    needs: [test-frontend, test-vrt]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    uses: k-wa-wa/nuage-workspace/.github/workflows/docker-build-push.yml@master
    with:
      context: ./frontend
      image: ghcr.io/${{ github.repository }}-frontend
