name: Nightly Mutation Testing

permissions:
  contents: read

on:
  schedule:
    # 毎日午前3時 (JST) = 前日 18:00 UTC に定期実行
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  mutation-frontend:
    name: Mutation Testing (Frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Stryker Mutation Testing
        run: npm run test:mutation:full || true

      - name: Upload Mutation Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stryker-mutation-report
          path: frontend/reports/mutation/
          retention-days: 14
