name: AivisSpeech

# 上流の AivisSpeech Engine からビルド用の道具を除いたイメージ (batch-tech-feed/aivisspeech/Dockerfile) を作る。
# PR ではビルドと動作確認だけを行い、GHCR への push は master への push のときだけにする。

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [master]
    paths:
      - 'batch-tech-feed/aivisspeech/**'
      - '.github/workflows/aivisspeech.yml'
  pull_request:
    paths:
      - 'batch-tech-feed/aivisspeech/**'
      - '.github/workflows/aivisspeech.yml'

jobs:
  build:
    name: Build, Verify and Push Image
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}/aivisspeech-engine
      # trivy-operator (nuage-monitoring-stack の trivy-operator チャート 0.38.1) と同じ trivy の版
      TRIVY_IMAGE: mirror.gcr.io/aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 元のイメージは展開後 4GB を超える。docker-container ドライバーだと BuildKit 側と Docker 側に二重に置かれ、
      # ランナーのディスクが足りなくなりうるため、Docker 本体でビルドする docker ドライバーを使う。
      # 同じ理由で gha キャッシュも使わない (元のイメージの層まで保存され、リポジトリのキャッシュ枠を圧迫する。
      # 自前の層は purge だけで、キャッシュの得も小さい)。
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./batch-tech-feed/aivisspeech
          file: ./batch-tech-feed/aivisspeech/Dockerfile
          pull: true
          load: true
          push: false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}

      - name: Verify build tools are removed
        run: |
          docker run --rm "${IMAGE}:sha-${GITHUB_SHA}" sh -c '
            rc=0
            for p in build-essential gcc g++ make cmake git libc6-dev linux-libc-dev; do
              status=$(dpkg-query -W -f="\${db:Status-Status}" "$p" 2>/dev/null || true)
              if [ "$status" = "installed" ]; then
                echo "::error::${p} が残っている"
                rc=1
              else
                echo "入っていない: ${p}"
              fi
            done
            exit $rc
          '

      - name: Verify speech synthesis
        run: |
          set -euo pipefail
          docker run -d --name aivisspeech -p 127.0.0.1:10101:10101 "${IMAGE}:sha-${GITHUB_SHA}"
          base=http://127.0.0.1:10101

          # 初回起動はモデルの取得などで数分かかることがあるため、最大 15 分待つ。
          deadline=$((SECONDS + 900))
          until version=$(curl -sf "${base}/version"); do
            if [ "$(docker inspect -f '{{.State.Running}}' aivisspeech)" != "true" ]; then
              echo "::error::エンジンのコンテナが止まった"
              exit 1
            fi
            if [ "${SECONDS}" -ge "${deadline}" ]; then
              echo "::error::/version が 15 分以内に返らなかった"
              exit 1
            fi
            sleep 5
          done
          echo "version: ${version}"

          speaker=$(curl -sf "${base}/speakers" | jq -er '.[0].styles[0].id')
          echo "speaker (style id): ${speaker}"

          curl -sf -X POST --get --data-urlencode "text=こんにちは。動作確認です。" \
            --data-urlencode "speaker=${speaker}" "${base}/audio_query" -o query.json
          curl -sf -X POST -H "Content-Type: application/json" --data-binary @query.json \
            "${base}/synthesis?speaker=${speaker}" -o out.wav

          magic=$(head -c 4 out.wav)
          if [ "${magic}" != "RIFF" ]; then
            echo "::error::/synthesis の返りが WAV ではない"
            exit 1
          fi
          echo "WAV を受け取った ($(stat -c %s out.wav) bytes)"

      - name: Show engine logs
        if: always()
        run: |
          docker logs aivisspeech 2>&1 | tail -n 200 || true
          docker rm -f aivisspeech || true

      # 件数を見るためだけに行い、失敗の条件にはしない。
      - name: Scan image with trivy
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/trivy"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${RUNNER_TEMP}/trivy:/out" \
            "${TRIVY_IMAGE}" image --scanners vuln --timeout 30m --quiet \
            --format json --output /out/report.json "${IMAGE}:sha-${GITHUB_SHA}"
          report="${RUNNER_TEMP}/trivy/report.json"
          {
            echo "### trivy の件数 (${IMAGE}:sha-${GITHUB_SHA})"
            echo
            echo "| 重要度 | 件数 |"
            echo "| --- | --- |"
            jq -r '[.Results[]?.Vulnerabilities[]?] as $v
              | (["CRITICAL","HIGH","MEDIUM","LOW","UNKNOWN"][] as $s
                  | "| \($s) | \([$v[] | select(.Severity == $s)] | length) |"),
                "| 合計 | \($v | length) |"' "${report}"
            echo
            echo "件数の多いパッケージ (上位 10)"
            echo
            jq -r '[.Results[]?.Vulnerabilities[]?.PkgName] | group_by(.) | map({p: .[0], n: length})
              | sort_by(-.n) | .[:10][] | "- \(.p): \(.n)"' "${report}"
          } | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 動作確認を通したイメージそのものを push する。
      - name: Push Docker image
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: docker push --all-tags "${IMAGE}"
